name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check fastestcache

      - name: Start server
        run: uv run gunicorn wsgi -w 1 -b 0.0.0.0:8888 --access-logfile=-
        background: true # Continues immediately to the next step

      - name: Ping server
        run: curl http://localhost:8888
