[project]
name = "django-fastest-redis"
version = "0.1.0"
description = "Benchmarking experiment for Redis cache configurations in Django"
requires-python = ">=3.14"
dependencies = [
    "django==6.0.7",
    "django-redis==7.0.0",
    "python-decouple==3.8",
    "ascii-graph==1.5.2",
    "hiredis==3.4.0",
    "msgpack-python==0.5.6",
    "ujson==5.13.0",
    "pyzstd>=0.19.1",
    "gunicorn>=26.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]
